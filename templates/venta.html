{% extends "base.html" %}
{% block contenido %}
<div class="venta">
  <section>
    <h2>Catálogo</h2>
    <input id="buscador" placeholder="Buscar producto…" oninput="filtrar()">
    <div class="grid">
      {% for p in productos %}
      <button class="producto" data-id="{{ p.id }}" data-nombre="{{ p.nombre }}"
              data-precio="{{ '%.2f'|format(p.precio / 100) }}" data-stock="{{ p.stock }}"
              data-unidad="{{ p.unidad }}"
              onclick="agregar({{ p.id }})" {% if p.stock <= 0 %}disabled{% endif %}>
        <span class="nombre">{{ p.nombre }}</span>
        <span class="precio">{{ p.precio|dinero }}{{ '/kg' if p.unidad == 'kg' }}</span>
        <span class="stock {{ 'bajo' if p.stock <= p.stock_minimo }}">Stock: {{ p.stock }}</span>
      </button>
      {% else %}
      <p>No hay productos. Agrega algunos en <a href="{{ url_for('productos') }}">Productos</a>.</p>
      {% endfor %}
    </div>
  </section>

  <aside class="carrito">
    <h2>Carrito</h2>
    <p id="vacio">Carrito vacío</p>
    <table id="tabla-carrito">
      <thead><tr><th>Producto</th><th>Cant.</th><th>Subtotal</th><th></th></tr></thead>
      <tbody id="lineas"></tbody>
      <tfoot><tr><td colspan="2">TOTAL</td><td id="total">$0.00</td><td></td></tr></tfoot>
    </table>
    <select id="metodo" onchange="clienteVisible()">
      <option value="efectivo">Efectivo</option>
      <option value="transferencia">Transferencia</option>
      <option value="tarjeta">Tarjeta</option>
      <option value="fiado">Fiado</option>
    </select>
    <select id="cliente" hidden>
      <option value="">— ¿A quién le fiamos? —</option>
      {% for c in clientes %}
      <option value="{{ c.id }}">{{ c.nombre }}</option>
      {% endfor %}
    </select>
    <button class="cobrar" id="btn-cobrar" onclick="cobrar()" disabled>Cobrar</button>
  </aside>
</div>

<script>
const carrito = new Map();  // id -> {nombre, precio, cantidad}

const esc = s => s.replace(/[&<>"]/g, c =>
  ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

function filtrar() {
  const q = document.getElementById('buscador').value.toLowerCase();
  document.querySelectorAll('.producto').forEach(btn => {
    btn.hidden = !!q && !btn.dataset.nombre.toLowerCase().includes(q);
  });
}

function agregar(id) {
  const btn = document.querySelector(`.producto[data-id="${id}"]`);
  const item = carrito.get(id) || {
    nombre: btn.dataset.nombre, precio: parseFloat(btn.dataset.precio),
    stock: parseFloat(btn.dataset.stock), unidad: btn.dataset.unidad,
    cantidad: 0
  };
  if (item.cantidad >= item.stock) return;  // sin más stock; el servidor revalida
  item.cantidad += 1;
  carrito.set(id, item);
  renderCarrito();
}

function cambiar(id, delta) {
  const item = carrito.get(id);
  if (!item) return;
  item.cantidad = Math.min(item.stock, Math.max(1, item.cantidad + delta));
  renderCarrito();
}

function quitar(id) {
  carrito.delete(id);
  renderCarrito();
}

function fijar(id, v) {
  const item = carrito.get(id);
  if (!item) return;
  v = parseFloat(v);
  if (!v || v <= 0) { renderCarrito(); return; }  // NaN o ≤0: revierte al valor previo
  item.cantidad = Math.min(item.stock, Math.round(v * 1000) / 1000);
  renderCarrito();
}

function fijarPesos(id, v) {
  const item = carrito.get(id);
  if (!item) return;
  v = parseFloat(v);
  if (!v || v <= 0) { renderCarrito(); return; }
  // $ ÷ precio por kg → kg con precisión de 1 g. ponytail: el total real lo fija
  // el gramaje (p. ej. $20 de algo a $30/kg cobra $20.01); exactitud al centavo
  // exigiría otra precisión de captura.
  item.cantidad = Math.min(item.stock, Math.round(v / item.precio * 1000) / 1000);
  renderCarrito();
}

function renderCarrito() {
  const lineas = document.getElementById('lineas');
  lineas.innerHTML = '';
  let total = 0;
  for (const [id, item] of carrito) {
    const subtotal = item.precio * item.cantidad;
    total += subtotal;
    lineas.insertAdjacentHTML('beforeend', `
      <tr>
        <td>${esc(item.nombre)}</td>
        <td class="cant">
          ${item.unidad === 'kg'
            ? `<input class="kg" type="number" step="0.25" min="0.001" value="${item.cantidad}"
                     onchange="fijar(${id}, this.value)" title="Kilos">
               <input class="pesos" type="number" step="0.5" min="0" placeholder="$"
                     value="${(item.cantidad * item.precio).toFixed(2)}"
                     onchange="fijarPesos(${id}, this.value)" title="Pesos">
               <small class="gramos">${Math.round(item.cantidad * 1000)} g</small>`
            : `<button onclick="cambiar(${id}, -1)">&minus;</button>
               ${item.cantidad}
               <button onclick="cambiar(${id}, 1)">+</button>`}
        </td>
        <td>$${subtotal.toFixed(2)}</td>
        <td><button class="quitar" onclick="quitar(${id})">&times;</button></td>
      </tr>`);
  }
  document.getElementById('total').textContent = '$' + total.toFixed(2);
  document.getElementById('vacio').hidden = carrito.size > 0;
  document.getElementById('btn-cobrar').disabled = carrito.size === 0;
}

function clienteVisible() {
  document.getElementById('cliente').hidden =
    document.getElementById('metodo').value !== 'fiado';
}

async function cobrar() {
  if (carrito.size === 0) return;
  const metodo = document.getElementById('metodo').value;
  const cuerpo = {items: [...carrito].map(([id, item]) =>
    ({producto_id: id, cantidad: item.cantidad})), metodo_pago: metodo};
  if (metodo === 'fiado') {
    const cid = parseInt(document.getElementById('cliente').value, 10);
    if (!cid) { alert('Elige a quién le fiaremos'); return; }
    cuerpo.cliente_id = cid;
  }
  const resp = await fetch('/api/ventas', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(cuerpo)
  });
  const datos = await resp.json();
  if (resp.ok) {
    if (datos.alertas && datos.alertas.length)
      alert('¡Stock bajo el mínimo!\n' + datos.alertas.join('\n'));
    window.location = '/ticket/' + datos.venta_id;
  } else {
    alert(datos.error);  // el carrito queda intacto
  }
}
</script>
{% endblock %}
