{% extends "base.html" %}
{% block contenido %}
<h2>Productos</h2>

<form class="alta" method="post" action="{{ url_for('productos') }}">
  <input name="nombre" placeholder="Nombre" required>
  <input name="precio" type="number" step="0.01" min="0" placeholder="Precio" required>
  <input name="stock" type="number" step="any" min="0" placeholder="Stock" required>
  <select name="unidad">
    <option value="unidad">Unidad</option>
    <option value="kg">Kilo</option>
  </select>
  <button type="submit">Agregar</button>
</form>

<table>
  <thead><tr><th>Nombre</th><th>Precio</th><th>Stock</th><th>Acciones</th></tr></thead>
  <tbody>
    {% for p in productos %}
    <tr>
      <td>{{ p.nombre }}</td>
      <td>{{ p.precio|dinero }}{{ '/kg' if p.unidad == 'kg' }}</td>
      <td class="{{ 'bajo' if p.stock <= p.stock_minimo }}"
          title="Mínimo: {{ p.stock_minimo }}">{{ p.stock }}{{ ' kg' if p.unidad == 'kg' }}</td>
      <td class="acciones-fila">
        <details>
          <summary>Editar</summary>
          <form class="editar" method="post"
                action="{{ url_for('editar_producto', producto_id=p.id) }}">
            <label>Nombre
              <input name="nombre" value="{{ p.nombre }}" required>
            </label>
            <label>Precio
              <input name="precio" type="number" step="0.01" min="0"
                     value="{{ p.precio }}" required>
            </label>
            <label>Unidad
              <select name="unidad">
                <option value="unidad" {{ 'selected' if p.unidad == 'unidad' }}>Unidad</option>
                <option value="kg" {{ 'selected' if p.unidad == 'kg' }}>Kilo</option>
              </select>
            </label>
            <label>Stock
              <input name="stock" type="number"
                     step="{{ '0.25' if p.unidad == 'kg' else '1' }}" min="0"
                     value="{{ p.stock }}" required>
            </label>
            <label>Stock mínimo
              <input name="stock_minimo" type="number"
                     step="{{ '0.25' if p.unidad == 'kg' else '1' }}" min="0"
                     value="{{ p.stock_minimo }}" required>
            </label>
            <button type="submit">Guardar</button>
          </form>
        </details>
        <details>
          <summary>Movimiento</summary>
          <form class="editar" method="post"
                action="{{ url_for('registrar_movimiento', producto_id=p.id) }}">
            <label>Tipo
              <select name="tipo">
                <option value="entrada">Entrada</option>
                <option value="salida">Salida</option>
              </select>
            </label>
            <label>Cantidad
              <input name="cantidad" type="number"
                     step="{{ '0.25' if p.unidad == 'kg' else '1' }}"
                     min="{{ '0.001' if p.unidad == 'kg' else '1' }}" required>
            </label>
            <label>Nota
              <input name="nota" placeholder="Opcional">
            </label>
            <button type="submit">Registrar</button>
          </form>
        </details>
        <form method="post"
              action="{{ url_for('eliminar_producto', producto_id=p.id) }}"
              onsubmit="return confirm('¿Eliminar?')">
          <button class="eliminar" type="submit">Eliminar</button>
        </form>
      </td>
    </tr>
    {% else %}
    <tr><td colspan="4">No hay productos.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
